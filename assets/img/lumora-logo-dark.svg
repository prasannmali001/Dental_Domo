<svg xmlns="http://www.w3.org/2000/svg" width="220" height="38" viewBox="0 0 220 38" fill="none" role="img" aria-label="Lumora Dental">
  <defs>
    <linearGradient id="lumora-gold-dark" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5D3BD"/>
      <stop offset="50%" stop-color="#D4BC9B"/>
      <stop offset="100%" stop-color="#B39268"/>
    </linearGradient>
  </defs>
  <!-- Architectural Luxury Monogram Mark -->
  <g transform="translate(2, 3)">
