    <path d="M16 1C8 1 2 7 2 16C2 23 8 30 16 30C22 30 29 24 29 16C29 7 23 1 16 1Z" stroke="url(#lumora-gold-dark)" stroke-width="1.75" stroke-linecap="round"/>
    <!-- Gentle internal luminous crescent -->
    <path d="M16 6C11 6 7 10.5 7 16C7 20.5 10.5 24.5 15 25" stroke="#FAF8F5" stroke-width="1.75" stroke-linecap="round"/>
    <!-- Subtle gold spark -->
    <circle cx="21" cy="11" r="2" fill="url(#lumora-gold-dark)"/>
  </g>
  <!-- Brand Typography -->
  <text x="44" y="22" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#FAF8F5">LUMORA</text>
  <text x="45" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.2" fill="#C5A880">DENTAL STUDIO</text>
</svg>
